# Project SwiftLint configuration.
# Used by:
#   - the pre-commit hook (scripts/hooks/swiftlint-changed.sh)
#   - sonar-swift's auto-run mode (sonar.swift.swiftlint.autorun=true)
#   - your IDE if it's wired to SwiftLint
#
# Keep this in sync with the SwiftLint-compat quality profile:
#     ./scripts/sync-swiftlint.sh
#
# Rule choice mirrors the SwiftLint-compat profile (~80 rules). Strict mode
# (`--strict`) escalates warnings to errors in pre-commit / CI.

disabled_rules:
  - trailing_whitespace # handled by the trailing-whitespace pre-commit hook
  - todo                # we have a dedicated SonarQube rule for this (S1007)

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicit_return
  - last_where
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_in_static_references
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_super_call
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - sorted_imports
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unused_import
  - vertical_parameter_alignment_on_call
  - yoda_condition

# concurrency
  - non_overridable_class_declaration
  - unhandled_throwing_task
  - unowned_variable_capture
  - weak_delegate

excluded:
  - Carthage
  - Pods
  - .build
  - DerivedData
  - examples
  - integration-tests
  - "**/*.generated.swift"

# Line length / function size limits — slightly more permissive than SwiftLint
# defaults; production iOS codebases often exceed the stock 100/60.
line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_function_declarations: true

function_body_length:
  warning: 60
  error: 120

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 600
  error: 1000

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - i
    - j
    - x
    - y
    - z
    - to
    - vc
    - up
