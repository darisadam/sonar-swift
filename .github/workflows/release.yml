name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # required to publish the GitHub Release

env:
  MAVEN_OPTS: "-Xmx2g -XX:+UseG1GC"

jobs:
  release:
    name: Build + publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # needed by the release notes step (`git log` since previous tag)

      - name: Set up JDK + Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build plugin and CLI
        run: mvn -B -ntp -DskipTests package

      - name: Generate release notes from git log
        id: notes
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            if [[ -n "$PREV" ]]; then
              echo "## Changes since $PREV"
            else
              echo "## Initial release"
            fi
            echo
            git log --no-merges --pretty="- %s (%an)" "${PREV:+$PREV..}HEAD"
          } > NOTES.md
          echo "path=NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            sonar-swift-plugin/target/sonar-swift-plugin-*.jar
            sonar-swift-cli/target/sonar-swift-cli.jar
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
