name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Build plugin
        run: mvn -B -ntp -DskipTests package

      - name: Build Swift parser (macOS arm64)
        uses: actions/checkout@v5     # nop placeholder
      # Real release builds the parser on macOS + Linux in separate jobs and downloads here.

      - name: Generate release notes
        id: notes
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo "## Changes since ${PREV:-the beginning}"
            echo
            git log --no-merges --pretty="- %s (%an)" "${PREV:+$PREV..}HEAD"
          } > NOTES.md
          echo "path=NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            sonar-swift-plugin/target/sonar-swift-plugin-*.jar
