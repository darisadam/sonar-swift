name: Build & test

on:
  push:
    branches: [main]
  pull_request:

# Cancel any in-flight run for the same ref when a new push lands.
# Branch protection still requires a green run on main, so cancellation only
# eats time we'd otherwise have wasted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: this workflow only needs to read source + upload artefacts.
permissions:
  contents: read

env:
  MAVEN_OPTS: "-Xmx2g -XX:+UseG1GC"

jobs:

  # ────────────────────────────────────────────────────────────────────
  # Plugin matrix: every supported OS × JDK combination.
  # ────────────────────────────────────────────────────────────────────
  plugin:
    name: Java plugin (${{ matrix.os }} · JDK ${{ matrix.jdk }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        jdk: ['17', '21']
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK + Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          # setup-java's built-in cache: hashes pom.xml automatically and is
          # OS/JDK aware. Replaces a manual actions/cache step.
          cache: maven

      - name: Build & test
        run: mvn -B -ntp -DskipTests=false package

      - name: Upload plugin JAR (one canonical build)
        if: matrix.os == 'ubuntu-24.04' && matrix.jdk == '17'
        uses: actions/upload-artifact@v4
        with:
          name: sonar-swift-plugin
          # ONLY the shaded jar — maven-shade-plugin also produces
          # `original-sonar-swift-plugin-*.jar` (pre-shade backup), which
          # has no Jackson and crashes SonarQube on load.
          path: sonar-swift-plugin/target/sonar-swift-plugin-[0-9]*.jar
          retention-days: 14
          if-no-files-found: error

      - name: Upload CLI JAR
        if: matrix.os == 'ubuntu-24.04' && matrix.jdk == '17'
        uses: actions/upload-artifact@v4
        with:
          name: sonar-swift-cli
          path: sonar-swift-cli/target/sonar-swift-cli.jar
          retention-days: 14

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.os }}-jdk${{ matrix.jdk }}
          path: '**/target/surefire-reports/'
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────
  # Swift parser matrix.
  # ────────────────────────────────────────────────────────────────────
  swift-parser:
    name: Swift parser (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Swift (Linux)
        if: matrix.os == 'ubuntu-24.04'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'

      # swift-syntax weighs in at ~70 MB built — caching .build saves ~3 minutes
      # per run. We key on the Package + Package.resolved so a dep upgrade
      # invalidates cleanly.
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            sonar-swift-parser/.build
            ~/.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('sonar-swift-parser/Package.swift', 'sonar-swift-parser/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build (release)
        working-directory: sonar-swift-parser
        run: swift build -c release

      - name: Test
        working-directory: sonar-swift-parser
        run: swift test

      - name: Upload parser binary
        uses: actions/upload-artifact@v4
        with:
          name: SwiftSonarParser-${{ matrix.os }}
          path: sonar-swift-parser/.build/release/SwiftSonarParser
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────
  # End-to-end integration: spin up SonarQube via docker, install the
  # freshly built plugin, scan the bug-ridden sample iOS sources.
  #
  # Runs on ubuntu-24.04 — Docker is native on Linux GHA runners. macOS
  # runners need Colima/Lima which has been unreliable; the integration
  # test doesn't actually need macOS (the sample app is loose Swift
  # source files, not an Xcode project — there's nothing to `xcodebuild`).
  # We trade real xcodebuild coverage for a reliable smoke test of the
  # plugin's analysis pipeline end-to-end. macOS-specific behaviour is
  # already exercised by the matrix builds above.
  # ────────────────────────────────────────────────────────────────────
  integration:
    name: Integration scan (sample sources)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [plugin, swift-parser]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Download plugin JAR
        uses: actions/download-artifact@v4
        with:
          name: sonar-swift-plugin
          path: artifacts/plugin

      - name: Download Linux parser binary
        uses: actions/download-artifact@v4
        with:
          name: SwiftSonarParser-ubuntu-24.04
          path: artifacts/parser

      # ── SonarQube docker image: cache the saved tar to skip a 1 GB pull ──
      # NB: cache key includes the full tag — Docker Hub does NOT publish a
      # shorthand `25.1-community` tag; only full BUILD.NUMBER tags exist.
      - name: Cache SonarQube docker image
        id: sq-image-cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache/sonarqube.tar
          key: docker-image-sonarqube-10.7.0-community

      - name: Restore SonarQube image (cache hit)
        if: steps.sq-image-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/docker-cache/sonarqube.tar

      - name: Pull SonarQube image (cache miss)
        if: steps.sq-image-cache.outputs.cache-hit != 'true'
        run: |
          docker pull sonarqube:10.7.0-community
          mkdir -p /tmp/docker-cache
          docker save sonarqube:10.7.0-community -o /tmp/docker-cache/sonarqube.tar

      # The docker-compose mounts ../sonar-swift-plugin/target/ into the
      # SonarQube container at /opt/sonarqube/extensions/plugins (read-only).
      # So instead of `docker cp` after startup (which can't write to a :ro
      # mount), we drop the jar into target/ BEFORE compose up. SonarQube
      # loads it during its normal boot — same path the local `make up` flow
      # uses for plugin developers.
      - name: Stage plugin jar for compose bind-mount
        run: |
          set -e
          PLUGIN_JAR=$(ls artifacts/plugin/sonar-swift-plugin-*.jar \
                          | grep -v original | head -1)
          test -n "$PLUGIN_JAR" || { echo "No plugin jar found"; ls artifacts/plugin/; exit 1; }
          mkdir -p sonar-swift-plugin/target
          cp "$PLUGIN_JAR" sonar-swift-plugin/target/
          echo "Staged plugin:"
          ls -lh sonar-swift-plugin/target/sonar-swift-plugin-*.jar

      - name: Start SonarQube with plugin pre-loaded
        run: |
          docker compose -f docker/docker-compose.yml up -d sonarqube db
          # 600s — initial SQ cold-boot on a GHA runner (DB schema migration,
          # Elasticsearch init, web context warm-up, plugin index scan) can
          # take 4-6 min on first run. Cache amortises this for re-runs.
          timeout 600 bash -c '
            while true; do
              STATUS=$(curl -sf http://localhost:9000/api/system/status 2>/dev/null || true)
              echo "  sq status: ${STATUS:-<unreachable>}"
              echo "$STATUS" | grep -q "\"UP\"" && exit 0
              sleep 10
            done
          '

      - name: Verify plugin loaded
        run: |
          # Hit the /api/plugins/installed endpoint and confirm sonar-swift is there.
          curl -fsS -u admin:admin http://localhost:9000/api/plugins/installed \
              | python3 -c '
          import json, sys
          plugins = json.load(sys.stdin).get("plugins", [])
          for p in plugins:
              print(f"  - {p.get(\"key\")} {p.get(\"version\")} ({p.get(\"name\")})")
          assert any(p.get("key") == "swift" for p in plugins), \
              "sonar-swift plugin not loaded by SonarQube"
          print("✓ sonar-swift plugin loaded")
          '

      - name: Dump SonarQube logs on plugin-load failure
        if: failure()
        run: |
          # Tee everything to $GITHUB_STEP_SUMMARY too — the summary is
          # exposed via the API as the run's `summary` field, so log
          # content is readable without GH auth on a public repo.
          {
            echo '## SonarQube container diagnostics'
            echo
            echo '### docker ps -a'
            echo '```'
            docker ps -a
            echo '```'
            echo
            echo '### /opt/sonarqube/extensions/plugins/'
            echo '```'
            docker exec sonar-swift-sq ls -lh /opt/sonarqube/extensions/plugins/ 2>&1 || true
            echo '```'
            echo
            echo '### docker compose logs (tail 200)'
            echo '```'
            docker compose -f docker/docker-compose.yml logs --tail 200 sonarqube db 2>&1 || true
            echo '```'
            echo
            echo '### sonar.log (tail 200)'
            echo '```'
            docker exec sonar-swift-sq tail -n 200 /opt/sonarqube/logs/sonar.log 2>&1 || true
            echo '```'
            echo
            echo '### web.log (tail 200)'
            echo '```'
            docker exec sonar-swift-sq tail -n 200 /opt/sonarqube/logs/web.log 2>&1 || true
            echo '```'
            echo
            echo '### ce.log (tail 100)'
            echo '```'
            docker exec sonar-swift-sq tail -n 100 /opt/sonarqube/logs/ce.log 2>&1 || true
            echo '```'
            echo
            echo '### es.log (tail 100)'
            echo '```'
            docker exec sonar-swift-sq tail -n 100 /opt/sonarqube/logs/es.log 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      # ── sonar-scanner CLI (zip download, cached) ────────────────────
      - name: Cache sonar-scanner CLI
        id: scanner-cache
        uses: actions/cache@v4
        with:
          path: ~/sonar-scanner
          key: sonar-scanner-cli-6.2.1.4610-linux-x64

      - name: Install sonar-scanner CLI
        if: steps.scanner-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip
          unzip -q /tmp/scanner.zip -d ~/
          mv ~/sonar-scanner-6.2.1.4610-linux-x64 ~/sonar-scanner
          rm /tmp/scanner.zip

      - name: Add sonar-scanner to PATH
        run: echo "$HOME/sonar-scanner/bin" >> "$GITHUB_PATH"

      - name: Run scanner against sample sources
        working-directory: examples/ios-sample-app
        run: |
          chmod +x ../../artifacts/parser/SwiftSonarParser
          sonar-scanner \
              -Dsonar.host.url=http://localhost:9000 \
              -Dsonar.token=admin \
              -Dsonar.projectKey=sonar-swift-sample \
              -Dsonar.projectName='sonar-swift sample app' \
              -Dsonar.sources=Sources \
              -Dsonar.tests=Tests \
              -Dsonar.swift.parser.path=$PWD/../../artifacts/parser/SwiftSonarParser

      - name: Verify findings landed in SonarQube
        run: |
          # Wait for analysis to settle, then check that issues were imported.
          sleep 5
          ISSUES=$(curl -fsS -u admin:admin \
            "http://localhost:9000/api/issues/search?componentKeys=sonar-swift-sample&ps=1" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("total", 0))')
          echo "Issues recorded: $ISSUES"
          test "$ISSUES" -gt 0

      - name: Tear down SonarQube
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v || true

      - name: Capture SonarQube logs on failure
        if: failure()
        run: |
          mkdir -p sq-logs
          docker logs sonar-swift-sq > sq-logs/sonarqube.log 2>&1 || true
          docker logs sonar-swift-db > sq-logs/db.log 2>&1 || true
        continue-on-error: true

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: |
            sq-logs/
            examples/ios-sample-app/.scannerwork/
          retention-days: 7
