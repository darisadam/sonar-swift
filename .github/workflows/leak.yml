name: Leak budget

# Runs the scanner against the sample project under tight heap limits and
# verifies that memory stays within the recorded budget. Catches accidental
# retentions (static caches, growing buffers, parser sidecar leaks) before
# they get merged.

on:
  pull_request:
    paths:
      - 'sonar-swift-plugin/**'
      - 'sonar-swift-parser/**'
      - 'pom.xml'
      - 'scripts/leak/**'
      - '.github/workflows/leak.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAVEN_OPTS: "-Xmx1g -XX:+UseG1GC"

jobs:
  leak:
    name: Leak budget (macos-15)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK + Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            sonar-swift-parser/.build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('sonar-swift-parser/Package.swift', 'sonar-swift-parser/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build plugin
        run: mvn -B -ntp -DskipTests package

      - name: Build Swift parser
        working-directory: sonar-swift-parser
        run: swift build -c release

      # ── Docker on macOS via Colima ──────────────────────────────────
      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: ${{ runner.os }}-brew-colima-scanner-v1

      - name: Install Docker + Colima + sonar-scanner
        run: |
          brew install --quiet docker docker-compose colima sonar-scanner
          mkdir -p ~/.docker/cli-plugins
          ln -sfn "$(brew --prefix)/opt/docker-compose/bin/docker-compose" \
                  ~/.docker/cli-plugins/docker-compose

      - name: Start Colima
        run: |
          colima start --cpu 2 --memory 4 --disk 14 \
                       --vm-type=vz --vz-rosetta \
                       --network-address
          docker info >/dev/null

      - name: Cache SonarQube docker image
        id: sq-image-cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache/sonarqube.tar
          key: docker-image-sonarqube-25.1-community

      - name: Restore SonarQube image (cache hit)
        if: steps.sq-image-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/docker-cache/sonarqube.tar

      - name: Pull SonarQube image (cache miss)
        if: steps.sq-image-cache.outputs.cache-hit != 'true'
        run: |
          docker pull sonarqube:25.1-community
          mkdir -p /tmp/docker-cache
          docker save sonarqube:25.1-community -o /tmp/docker-cache/sonarqube.tar

      - name: Start SonarQube
        run: docker compose -f docker/docker-compose.yml up -d sonarqube db

      - name: Wait for SonarQube
        run: |
          timeout 240 bash -c 'until curl -sf http://localhost:9000/api/system/status 2>/dev/null | grep -q "\"UP\""; do sleep 5; done'

      - name: Run leak compare
        env:
          SONAR_HOST_URL: http://localhost:9000
          SONAR_TOKEN: admin
        run: ./scripts/leak/leak-check.sh --mode=compare --slack=0.05

      - name: Tear down Colima
        if: always()
        run: |
          docker compose -f docker/docker-compose.yml down -v || true
          colima stop -f || true

      - name: Upload leak reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leak-reports
          path: |
            .sonar/leaks/latest.json
            .sonar/leaks/leak-*.json
            .sonar/leaks/oom.hprof
          retention-days: 14
