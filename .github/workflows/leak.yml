name: Leak budget

# Runs the scanner against the sample project under tight heap limits and
# verifies that memory stays within the recorded budget. Catches accidental
# retentions (static caches, growing buffers, parser sidecar leaks) before
# they get merged.

on:
  pull_request:
    paths:
      - 'sonar-swift-plugin/**'
      - 'sonar-swift-parser/**'
      - 'pom.xml'
      - 'scripts/leak/**'
      - '.github/workflows/leak.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAVEN_OPTS: "-Xmx1g -XX:+UseG1GC"

jobs:
  leak:
    # Native Docker on Linux runners — no Colima/VM overhead, faster + reliable.
    # The leak budget compares JVM heap of the scanner process, which is OS-
    # independent (the budget JSON is keyed by `heap.used` bytes). Linux is fine.
    name: Leak budget (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK + Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            sonar-swift-parser/.build
            ~/.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('sonar-swift-parser/Package.swift', 'sonar-swift-parser/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build plugin
        run: mvn -B -ntp -DskipTests package

      - name: Build Swift parser
        working-directory: sonar-swift-parser
        run: swift build -c release

      # ── SonarQube docker image cache ───────────────────────────────
      - name: Cache SonarQube docker image
        id: sq-image-cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache/sonarqube.tar
          key: docker-image-sonarqube-10.7.0-community

      - name: Restore SonarQube image (cache hit)
        if: steps.sq-image-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/docker-cache/sonarqube.tar

      - name: Pull SonarQube image (cache miss)
        if: steps.sq-image-cache.outputs.cache-hit != 'true'
        run: |
          docker pull sonarqube:10.7.0-community
          mkdir -p /tmp/docker-cache
          docker save sonarqube:10.7.0-community -o /tmp/docker-cache/sonarqube.tar

      # The docker-compose bind-mounts ../sonar-swift-plugin/target/ at
      # /opt/sonarqube/extensions/plugins:ro — the plugin jar built above
      # is already in target/ from the maven build, so SonarQube auto-loads
      # it during boot. No docker cp needed.
      - name: Start SonarQube
        run: |
          docker compose -f docker/docker-compose.yml up -d sonarqube db
          timeout 300 bash -c '
            while true; do
              STATUS=$(curl -sf http://localhost:9000/api/system/status 2>/dev/null || true)
              echo "  sq status: $STATUS"
              echo "$STATUS" | grep -q "\"UP\"" && exit 0
              sleep 5
            done
          '

      - name: Verify plugin loaded
        run: |
          curl -fsS -u admin:admin http://localhost:9000/api/plugins/installed \
              | python3 -c 'import json,sys; assert any(p.get("key")=="swift" for p in json.load(sys.stdin).get("plugins",[])), "sonar-swift plugin not loaded"; print("✓ sonar-swift plugin loaded")'

      - name: Dump SonarQube logs on plugin-load failure
        if: failure()
        run: |
          docker ps -a
          docker exec sonar-swift-sq ls -lh /opt/sonarqube/extensions/plugins/ || true
          docker exec sonar-swift-sq tail -n 200 /opt/sonarqube/logs/sonar.log 2>/dev/null || true
          docker exec sonar-swift-sq tail -n 200 /opt/sonarqube/logs/web.log 2>/dev/null || true
          docker exec sonar-swift-sq tail -n 200 /opt/sonarqube/logs/ce.log 2>/dev/null || true
        continue-on-error: true

      # ── sonar-scanner CLI ──────────────────────────────────────────
      - name: Cache sonar-scanner CLI
        id: scanner-cache
        uses: actions/cache@v4
        with:
          path: ~/sonar-scanner
          key: sonar-scanner-cli-6.2.1.4610-linux-x64

      - name: Install sonar-scanner CLI
        if: steps.scanner-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip
          unzip -q /tmp/scanner.zip -d ~/
          mv ~/sonar-scanner-6.2.1.4610-linux-x64 ~/sonar-scanner
          rm /tmp/scanner.zip

      - name: Add sonar-scanner to PATH
        run: echo "$HOME/sonar-scanner/bin" >> "$GITHUB_PATH"

      - name: Run leak compare
        env:
          SONAR_HOST_URL: http://localhost:9000
          SONAR_TOKEN: admin
        run: ./scripts/leak/leak-check.sh --mode=compare --slack=0.05

      - name: Tear down SonarQube
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v || true

      - name: Upload leak reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leak-reports
          path: |
            .sonar/leaks/latest.json
            .sonar/leaks/leak-*.json
            .sonar/leaks/oom.hprof
          retention-days: 14
