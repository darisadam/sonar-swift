name: sonar-swift-dev

# Local dev / demo stack.
#
# Services:
#   sonarqube — Sonar 25.x community on :9000 (the canonical code-analysis UI)
#   db        — Postgres backing SonarQube
#   dashboard — sonar-swift control console on :8080 (this repo's CLI dashboard)
#
# Boot order:
#   docker compose up -d db
#   docker compose up -d sonarqube         # waits for Postgres
#   docker compose up -d dashboard         # waits for SonarQube readiness
#
# Or just `make up` from the repo root, which does all three.

services:
  sonarqube:
    image: sonarqube:25.1-community
    container_name: sonar-swift-sq
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sq_data:/opt/sonarqube/data
      - sq_extensions:/opt/sonarqube/extensions
      - sq_logs:/opt/sonarqube/logs
      # auto-load locally-built plugin
      - ../sonar-swift-plugin/target:/opt/sonarqube/extensions/plugins:ro
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/api/system/status"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  db:
    image: postgres:16
    container_name: sonar-swift-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - pg_data:/var/lib/postgresql/data

  dashboard:
    image: eclipse-temurin:17-jre
    container_name: sonar-swift-dashboard
    command: >
      java -jar /opt/sonar-swift/sonar-swift-cli.jar
      dashboard
      --bind 0.0.0.0
      --port 8080
      --sonar-url http://sonarqube:9000
      --workspace /workspace
    ports:
      - "8080:8080"
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
    volumes:
      # the CLI jar is built locally to sonar-swift-cli/target/
      - ../sonar-swift-cli/target:/opt/sonar-swift:ro
      # workspace mount so /scans, /leaks etc. see the host repo
      - ..:/workspace:ro
    depends_on:
      sonarqube:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  sq_data:
  sq_extensions:
  sq_logs:
  pg_data:
